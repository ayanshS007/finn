# Does NSE answer from GitHub Actions? One-off probe for S5's decision on where the announcement job
# runs. It runs the project's own NSE client against the live announcements API and prints only the
# HTTP outcome and a row count. Delete this file once the answer is recorded in scripts/schedule_local.md.
name: nse-probe

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/nse-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx pyyaml
      - name: curl (HTTP/1.1, browser user agent)
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          echo "runner egress: $(curl -s https://api.ipify.org || echo unknown)"
          for url in https://www.nseindia.com/ \
                     https://nsearchives.nseindia.com/content/RSS/Online_announcements.xml \
                     "https://www.nseindia.com/api/corporate-announcements?index=equities&symbol=INFY"; do
            code=$(curl -s --http1.1 -A "$UA" -H 'Accept: application/json, text/plain, */*' -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
            echo "$code  $url"
          done
      - name: finn NSE client, last 3 days for INFY
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from finn.sources.http import SourceError
          from finn.sources.nse import NSEClient
          today = date.today()
          try:
              rows = NSEClient().announcements("INFY", today - timedelta(days=3), today, ttl=0)
              print(f"NSEClient: OK, {len(rows)} announcements")
          except SourceError as exc:
              print(f"NSEClient: FAILED ({exc})")
          PY
