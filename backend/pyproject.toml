[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finn"
version = "0.1.0"
description = "FINN: mobile-first investment agent for NSE/BSE filings"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic>=2",
    "pdfplumber",
    "pypdf",
    "rank-bm25",
    "yfinance",
    "pandas",
    "pyarrow",
    "supabase>=2.33",  # accepts the new sb_publishable_ / sb_secret_ keys
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "python-dotenv",
    "pyyaml",
    "groq",
    "google-genai",
    "tavily-python",
    "bse",
    "beautifulsoup4",
    "lxml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["finn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real sources over the network; skipped unless --run-live is given"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # test data: filing subjects are long single strings
